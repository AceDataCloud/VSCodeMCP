name: Retire legacy VS Code bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retire-legacy-vscode-bundle
  cancel-in-progress: false

jobs:
  unpublish:
    if: github.repository == 'AceDataCloud/VSCodeMCP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove the retired bundle from VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          npx --yes @vscode/vsce unpublish acedatacloud.acedatacloud-mcp --force
      - name: Remove the legacy Open VSX listing when configured
        if: vars.OVSX_ENABLED == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT"
          npx --yes ovsx unpublish acedatacloud.acedatacloud-mcp --pat "$OVSX_PAT"
